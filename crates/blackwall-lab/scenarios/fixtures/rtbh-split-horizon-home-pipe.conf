## Fixture for rtbh-split-horizon-pipe-blocked.kdl. Node "home" models the
## fleet's real home box for the still-open bug documented in
## docs/BLACKWALL.md ("RTBH doesn't propagate past home"): imports the
## iBGP-learned RTBH route from "a" (blackwall) into a SEPARATE table
## (`rtbh4`, matching the real box's proposed `protocol bgp blackwall { ipv4
## { table rtbh4; ... }; }`), pipes it into `master4`, then re-exports
## `master4` to "c" (a POP, e.g. kc) over a second plain iBGP session with NO
## `rr client`. This tests the specific hypothesis that a pipe — being a
## non-BGP protocol with no ASN of its own — defeats BIRD's iBGP split
## horizon by decoupling the route's "owning protocol in this table" from the
## session it was originally learned over.
##
## Empirically it does NOT: BIRD 2.17.1 still refuses to export this route to
## "c" (`show route export to_c` omits it) even through the pipe. The `[i]`
## (internal) marker and the resulting split-horizon suppression survive the
## table copy — see rtbh-split-horizon-pipe-with-rr.kdl for the control that
## proves `rr client` on the *outbound* (to-POP) session is what actually
## fixes it, pipe or no pipe.
##
## Addresses hardcoded to match `link "a" "home" subnet="10.0.1.0/30"` (home
## gets .2) and `link "home" "c" subnet="10.0.2.0/30"` (home gets .1) — see
## rtbh-split-horizon-a.conf's header for why this can't use `{node.addr}`
## placeholders.
ipv4 table rtbh4;

protocol direct {
    ipv4;
    interface "*";
}

filter rtbh_import {
    if (65535, 666) ~ bgp_community then {
        dest = RTD_BLACKHOLE;
        accept;
    }
    accept;
}

protocol bgp to_a {
    local as 214806;
    neighbor 10.0.1.1 as 214806;
    ipv4 { table rtbh4; import filter rtbh_import; export none; };
}

protocol pipe rtbh_to_master4 {
    table master4;
    peer table rtbh4;
    import all;
    export none;
}

protocol bgp to_c {
    local as 214806;
    neighbor 10.0.2.2 as 214806;
    ipv4 { import all; export all; };
}
