## Fixture for rtbh-split-horizon-pipe-with-rr.kdl. Identical to
## rtbh-split-horizon-home-pipe.conf (rtbh4 table + pipe into master4) except
## `to_c` also has `rr client;` — the control that proves route reflection,
## not the pipe, is what actually lets the route reach "c". With this set,
## BIRD adds `BGP.originator_id`/`BGP.cluster_list` and exports normally.
ipv4 table rtbh4;

protocol direct {
    ipv4;
    interface "*";
}

filter rtbh_import {
    if (65535, 666) ~ bgp_community then {
        dest = RTD_BLACKHOLE;
        accept;
    }
    accept;
}

protocol bgp to_a {
    local as 214806;
    neighbor 10.0.1.1 as 214806;
    ipv4 { table rtbh4; import filter rtbh_import; export none; };
}

protocol pipe rtbh_to_master4 {
    table master4;
    peer table rtbh4;
    import all;
    export none;
}

protocol bgp to_c {
    local as 214806;
    neighbor 10.0.2.2 as 214806;
    rr client;
    ipv4 { import all; export all; };
}
