## Fixture for rtbh-split-horizon-*.kdl. Node "c" stands in for a POP (e.g.
## kc): plain iBGP session to "home", same ASN 214806, no `rr client` (a POP
## session never gets one — only `home`'s session facing it would). Address
## hardcoded to match `link "home" "c" subnet="10.0.2.0/30"` (home=.1, c=.2).
protocol bgp to_home {
    local as 214806;
    neighbor 10.0.2.1 as 214806;
    ipv4 { import all; export none; };
}
