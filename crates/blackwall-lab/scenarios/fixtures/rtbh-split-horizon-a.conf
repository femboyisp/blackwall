## Fixture for rtbh-split-horizon-*.kdl. Node "a" stands in for blackwalld's
## container: originates one RTBH-style blackhole (RFC 7999 community
## 65535:666) over an iBGP session to "home" (same ASN 214806 as blackwall's
## real `protocol bgp blackwall` session). Address is hardcoded to match the
## topology's `link "a" "home" subnet="10.0.1.0/30"` (a=.1, home=.2) — this
## file is spliced in verbatim by `render_bird_with_include`, which cannot
## resolve `{home.addr}` placeholders itself (those are a `run`/env-only
## feature; see blackwall-lab/src/addr.rs::resolve_env).
protocol static origin {
    ipv4;
    route 203.0.113.99/32 blackhole { bgp_community.add((65535,666)); };
}

protocol bgp to_home {
    local as 214806;
    neighbor 10.0.1.2 as 214806;
    ipv4 { import none; export all; };
}
